services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}

    container_name: invoice-frontend

    restart: unless-stopped

    ports:
      - "127.0.0.1:3001:3000"

    env_file:
      - .env

    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
